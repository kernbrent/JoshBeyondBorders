<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Now Playing | Josh Beyond Borders</title>
  <link rel="icon" type="image/png" href="../assets/beyond2026080404.png">
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    body{min-height:100vh;margin:0;padding:1rem;background:#19322b;color:#fff}
    .player-shell{max-width:390px;margin:0 auto}
    .player-brand{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem;color:#fff;font-weight:800}
    .player-brand img{width:34px;height:34px;border-radius:50%}
    .player-shell h1{margin:.2rem 0 .5rem;font-family:"Playfair Display",serif;font-size:2rem}
    .player-shell>p{margin:.25rem 0 1rem;color:rgba(255,255,255,.75);line-height:1.45}
    #spotify-player{overflow:hidden;border-radius:14px;background:#111}
    .player-note{font-size:.78rem}
  </style>
</head>
<body>
  <main class="player-shell">
    <div class="player-brand"><img src="../assets/beyond2026080404.png" alt=""><span>Josh Beyond Borders</span></div>
    <p class="eyebrow">Now playing</p>
    <h1 id="track-title">Joshua Jacob</h1>
    <p>This player stays open while you browse the site. Choosing another song will replace the current track.</p>
    <div id="spotify-player" aria-label="Spotify music player"></div>
    <p class="player-note">Spotify may require a sign-in or an additional tap to begin full playback on some devices.</p>
  </main>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  <script>
    "use strict";
    const params = new URLSearchParams(window.location.search);
    const allowedTracks = new Set(["4bifuhNOXrrhsV73nK6ykP", "2f1Kpd2hER6gOeyzPfzHcS"]);
    const trackId = allowedTracks.has(params.get("track")) ? params.get("track") : "4bifuhNOXrrhsV73nK6ykP";
    const trackTitle = params.get("title") || "Joshua Jacob";
    document.getElementById("track-title").textContent = trackTitle;
    document.title = `${trackTitle} | Josh Beyond Borders`;

    window.onSpotifyIframeApiReady = (IFrameAPI) => {
      IFrameAPI.createController(
        document.getElementById("spotify-player"),
        { width: "100%", height: 352, uri: `spotify:track:${trackId}` },
        (controller) => controller.play()
      );
    };

    const stopWhenSiteCloses = window.setInterval(() => {
      if (!window.opener || window.opener.closed) {
        window.clearInterval(stopWhenSiteCloses);
        window.close();
        return;
      }
      try {
        if (window.opener.location.origin !== window.location.origin) window.close();
      } catch {
        window.close();
      }
    }, 1000);
  </script>
</body>
</html>
